name: CD

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  TERRAFORM_STATE_BUCKET: choesuna-terraform-state

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/infra-study:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/infra-study:latest

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [build-and-push]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform state bucket exists
        run: |
          set -euo pipefail
          if aws s3api head-bucket --bucket "${TERRAFORM_STATE_BUCKET}" 2>/dev/null; then
            echo "State bucket already exists: ${TERRAFORM_STATE_BUCKET}"
          else
            echo "Creating state bucket: ${TERRAFORM_STATE_BUCKET}"
            aws s3api create-bucket \
              --bucket "${TERRAFORM_STATE_BUCKET}" \
              --region "${AWS_REGION}" \
              --create-bucket-configuration LocationConstraint="${AWS_REGION}"
            aws s3api put-bucket-versioning \
              --bucket "${TERRAFORM_STATE_BUCKET}" \
              --versioning-configuration Status=Enabled
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
